name: Update README Cards

on:
  schedule:
    - cron: '0 0 * * *' # Roda todo dia à meia-noite
  workflow_dispatch: # Permite rodar na mão pelo botão

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Github Stats SVG
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: AlarconPedro
          template: classic
          base: header, activity, community, repositories-compact
          config_timezone: America/Sao_Paulo
          filename: github-metrics.svg
          
          output_action: commit # Força a própria lib a commitar direto
          committer_branch: master # Mude para 'main' se a sua branch principal for 'main'

      # O passo de "Commit and Push Changes" antigo pode ser apagado, 
      # pois a linha 'output_action: commit' acima faz isso de forma nativa e segura!
