name: Update README Cards

on:
  schedule:
    - cron: '0 0 * * *' # Roda automaticamente todos os dias à meia-noite
  workflow_dispatch: # Permite que você clique em um botão para rodar na hora

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Github Stats SVG
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: AlarconPedro
          template: classic
          base: header, activity, community, repositories-compact
          config_timezone: America/Sao_Paulo
          filename: github-metrics.svg
          output_action: none

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add github-metrics.svg || true
          git commit -m "Update profile metrics card [skip ci]" || true
          git push || true
